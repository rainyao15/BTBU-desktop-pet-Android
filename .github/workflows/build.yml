name: build-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip

      # 不用 android-actions/setup-android@v3 —— 那个 action 经常在"下载 cmdline-tools"上翻车。
      # runner 自带 Android SDK，先用它；真没有才手动下 cmdline-tools 兜底。
      - name: 准备 Android SDK（优先用 runner 自带的）
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          if [ ! -d "$SDK" ]; then SDK="$HOME/android-sdk"; fi
          echo "SDK=$SDK"
          mkdir -p "$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "$SDK/platform-tools"   >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "--- 现有内容 ---"
          ls "$SDK" || true

      - name: 安装 SDK 组件（缺什么装什么）
        run: |
          set -euo pipefail
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "没有 sdkmanager，手动下 cmdline-tools"
            curl -fsSL -o /tmp/clt.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKM"
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "--- 已装 ---"
          "$SDKM" --list_installed

      - name: 版本自检（出问题先看这一步）
        run: |
          java -version
          node -v
          ffmpeg -version | head -1
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms"

      # Windows 上生成的提交往往没有可执行位，不加这句 CI 会 "Permission denied"
      - name: 修可执行位
        run: chmod +x gradlew tools/fetch-and-transcode.sh tools/*.mjs

      - name: 还原素材（从上游 dsh-pet 转码，约 10~20 分钟）
        env:
          # 钉死上游版本：0.3.8 实测含 106 段 webm + config.jsonc，避免上游改版把 CI 弄红
          PKG: dsh-pet@0.3.8
          WIDTH: '480'
          FPS: '15'
          QUALITY: '50'
        run: |
          set -euo pipefail
          sudo ln -sf "$(which ffmpeg)" /usr/local/bin/ffmpeg
          ./tools/fetch-and-transcode.sh
          echo "--- 转码结果 ---"
          du -sh app/src/main/assets/webp || true
          ls app/src/main/assets/webp | wc -l
          ls -la app/src/main/assets/pet-config.json || true

      - name: 构建 debug APK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 产物改名（带上北工商标记）
        if: success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/btbu-pet-debug.apk
          ls -lh dist

      # 构建失败也把日志捞出来，方便截图发我
      - name: 失败时收集日志
        if: failure()
        run: |
          echo "===== gradle daemon log ====="
          find ~/.gradle/daemon -name "*.log" -print -exec tail -200 {} \; 2>/dev/null | tail -400 || true
          echo "===== 编译器报告 ====="
          find app/build -name "*.txt" -path "*error*" -exec cat {} \; 2>/dev/null | head -200 || true

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btbu-pet-debug-apk
          path: dist/btbu-pet-debug.apk
